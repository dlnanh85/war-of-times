# Manual Claude helper.
#
# Runs when a human writes "@claude ..." in an issue, a PR comment, a review or a review comment.
# Claude does what the comment asks: explain code, fix lint, "rebase onto main", and so on.
# It can run yarn, use git and push to the PR branch.
#
# Only humans can trigger it: `allowed_bots` is deliberately NOT set, so comments from claude[bot]
# or other bots are ignored. That's also why every agent prompt says never to write "@claude".
# See .agents/docs/agent-workflow-impl-plan.md, phase P7.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time per issue/PR; a running request is never cancelled.
    # Set on the job (not the workflow) so comments without the trigger text, whose job is
    # skipped by `if:`, never join the group and can't push a waiting request out.
    # Note: GitHub keeps at most one waiting run per group, so a third request sent while
    # one is running and one is waiting replaces the waiting one.
    concurrency:
      group: claude-manual-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push fixes, e.g. "rebase onto main"
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for rebases and diffs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && '22' || '' }}
          cache: ${{ hashFiles('yarn.lock') != '' && 'yarn' || '' }}

      - name: Install dependencies
        if: hashFiles('yarn.lock') != ''
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Model: the action's default.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(yarn:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue view:*)"
