# Agent fixer.
#
# Called by the reviewer (claude-code-review.yml, job `fix`) when an agent PR gets "changes requested".
# For each blocking review comment, Claude either fixes it, pushes back with a reply that cites evidence,
# or (only when the fix lies outside the issue's Scope) escalates to the TL.
# It then pushes ONCE, as claude[bot]. That push triggers a new review run, which sees the fixes and the
# replies. That's the review ↔ fix loop. If nothing gets pushed, the PR is handed to the TL with `needs-tl`.
#
# See .agents/docs/agent-workflow-impl-plan.md, phase P4.

name: Agent Fix

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      round:
        type: number
        required: true

permissions: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # GH_TOKEN is NOT set here on purpose: the Claude step must push with the Claude app token,
    # so the push triggers the reviewer again. Bash steps set it themselves.
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Read PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,headRefOid,closingIssuesReferences)"
          branch="$(jq -r '.headRefName' <<< "$pr_json")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"

          # Linked issue: the PR's "Closes #n", or else the n in the branch name agent/issue-<n>.
          issue="$(jq -r '.closingIssuesReferences[0].number // empty' <<< "$pr_json")"
          if [ -z "$issue" ] && [[ "$branch" =~ ^agent/issue-([0-9]+)$ ]]; then
            issue="${BASH_REMATCH[1]}"
          fi
          if [ -z "$issue" ]; then
            echo "::warning::No linked issue found for PR #$PR_NUMBER; the model will be sonnet."
          fi

          echo "PR #$PR_NUMBER: branch=$branch head=$head_sha issue=${issue:-none}"
          {
            echo "branch=$branch"
            echo "head_sha=$head_sha"
            echo "issue=$issue"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && '22' || '' }}
          cache: ${{ hashFiles('yarn.lock') != '' && 'yarn' || '' }}

      - name: Install dependencies
        if: hashFiles('yarn.lock') != ''
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile

      - name: Resolve model
        id: model
        if: steps.pr.outputs.issue != ''
        uses: ./.github/actions/resolve-model
        with:
          issue-number: ${{ steps.pr.outputs.issue }}
          token: ${{ secrets.PROJECT_TOKEN }}
          project-owner: ${{ vars.PROJECT_OWNER }}
          project-number: ${{ vars.PROJECT_NUMBER }}
          field: ${{ vars.STORY_POINT_FIELD }}
          opus-min-points: ${{ vars.OPUS_MIN_POINTS }}

      - name: Fix review comments
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review run that calls this was usually started by a claude[bot] push. No other bots.
          allowed_bots: claude
          claude_args: |
            --model ${{ steps.model.outputs.model || 'sonnet' }}
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(yarn:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(gh api repos/*/pulls/*/comments:*),Bash(gh api repos/*/pulls/*/comments/*/replies:*)"
            --json-schema '{"type":"object","required":["outcome"],"properties":{"outcome":{"enum":["pushed","escalated"]},"escalation":{"type":"string"}}}'
          prompt: |
            You are an AI agent fixing review feedback on PR #${{ inputs.pr_number }} in ${{ github.repository }}.
            This is review round ${{ inputs.round }}. You are on the PR's branch `${{ steps.pr.outputs.branch }}`.
            The linked issue is #${{ steps.pr.outputs.issue || 'unknown' }}.

            ## Read first
            1. `CLAUDE.md` (agent rules) and the linked issue's acceptance criteria and scope (`gh issue view <issue number>`).
            2. The latest review summary: `gh pr view ${{ inputs.pr_number }} --comments`. Use the LAST comment containing `<!-- claude-review:verdict=`. Its "Blocking" list is what you must handle. Ignore "Non-blocking".
            3. The inline review comments and their replies: `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments --paginate`. The reviewer's comments are by `claude[bot]`; replies have `in_reply_to_id` set.
            4. The current diff: `gh pr diff ${{ inputs.pr_number }}`.

            ## For EACH blocking issue, choose one
            - Fix it. Change only what's needed for that issue; don't refactor anything else.
            - Push back. Reply in that comment's thread:
              `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments/<comment_id>/replies -f body="..."`
              explaining why it shouldn't change. The reason MUST cite something concrete: the issue's acceptance criteria, a CLAUDE.md rule, a test result, or documentation. "I disagree" alone is not allowed.
              If the reviewer already answered your earlier push-back on that comment and held its position with a new argument, don't push back again: fix it.
              Blocking issues that have no inline comment (only in the summary list) can't get a thread reply; fix those.
              A blocking PR title: fix it with `gh pr edit ${{ inputs.pr_number }} --title "<type>(<scope>): <subject>"` (CLAUDE.md → Conventions → Git).
              A blocking commit message can't be fixed without a force-push: escalate it instead (the tech lead fixes it in the squash message).
            - Escalate. ONLY when the only correct fix is to change code or a decision outside the issue's Scope.
              Don't change anything for that issue. Reply in its comment thread (same command as push-back) with the escalation body,
              which must have all four parts:
              1. **Evidence:** file + lines, or the decision/issue it's about.
              2. **Why it's a problem,** and what would break (a concrete example where possible).
              3. **Options,** for example (a) fix the foundation first in a separate issue, (b) accept the risk, (c) change this issue.
              4. **A drafted follow-up issue:** a title plus a Scope (In scope / Out of scope) the tech lead can copy. Never create issues yourself.
              If the blocking issue has no comment thread (it's only in the summary list), don't reply anywhere: just return the body in `escalation`. The workflow posts it in a PR comment.
              Never escalate over style, naming or personal preference. Conventions violations are fixed, not escalated (except commit messages, see above).

            ## Order and pushing (exactly one push)
            1. Post all push-back and escalation replies first, so they exist before the next review starts.
            2. Make the fixes as normal, meaningful commits. The message names what was fixed and follows CLAUDE.md → Conventions → Git (for example `fix(shared): fix off-by-one in gold income`).
            3. Run `yarn format`, `yarn lint`, `yarn typecheck` and `yarn test` — only the scripts that exist in the root `package.json` — and fix failures.
               Never add a missing script yourself.
            4. Push once, at the end: `git push origin ${{ steps.pr.outputs.branch }}`. That push starts the next review.
            5. Only if there was nothing to fix in the code (every blocking issue got a push-back reply, or the only fix was a PR title change): make an empty commit instead,
               `git commit --allow-empty -m "chore(agent): reply to review comments"`, and push that. The push is what starts the next review.
               Never add an empty commit when there are real fix commits. Never push more than once. Never force-push.
            6. If you escalated an issue: still push the fixes for the other issues (steps 2–4). If there is nothing else to push, don't push at all.

            ## Your final output
            - `outcome`: "escalated" if you escalated any blocking issue, otherwise "pushed".
            - `escalation`: when escalated, the same escalation body you posted (all four parts).

            ## Hard rules
            - Never write the text "@claude" anywhere (code, commits, replies).
            - Never merge the PR, and never push to `main`.
            - Don't post a summary comment on the PR; only reply in review threads.

      - name: Read fix result
        id: fix_result
        if: ${{ !cancelled() }}
        env:
          FIX_JSON: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          # Never fails: a missing or invalid result just means outcome is empty.
          outcome="$(printf '%s' "$FIX_JSON" | jq -r '.outcome // empty' 2> /dev/null || true)"
          echo "Fix outcome: ${outcome:-unknown}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      # A review comment can only be fixed outside this issue's Scope: ask the TL to decide.
      # Fixes for the other comments (if any) were still pushed, so the review runs again;
      # the picker sees `needs-tl` and doesn't treat the PR as busy.
      - name: Escalate
        id: escalate
        if: ${{ !cancelled() && steps.fix_result.outputs.outcome == 'escalated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_JSON: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          escalation="$(printf '%s' "$FIX_JSON" | jq -r '.escalation // empty' 2> /dev/null || true)"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=needs-tl" > /dev/null
          comment_file="$RUNNER_TEMP/fix-escalation-comment.md"
          {
            printf '🤖 The agent stopped: a review comment can only be fixed by changing code or a decision outside this issue'\''s Scope. See the thread for details and options.\n\n'
            if [ -n "$escalation" ]; then
              printf '<details><summary>Escalation</summary>\n\n%s\n\n</details>\n\n' "$escalation"
            fi
            printf '<sub>[Run log](%s)</sub>\n' "$RUN_URL"
          } > "$comment_file"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$comment_file" > /dev/null

      - name: "Board: Blocked (needs decision)"
        if: ${{ !cancelled() && steps.escalate.outcome == 'success' && steps.pr.outputs.issue != '' }}
        continue-on-error: true
        uses: ./.github/actions/set-project-status
        with:
          issue-number: ${{ steps.pr.outputs.issue }}
          status: Blocked
          token: ${{ secrets.PROJECT_TOKEN }}
          project-owner: ${{ vars.PROJECT_OWNER }}
          project-number: ${{ vars.PROJECT_NUMBER }}

      # Skipped after an escalation: that case is already handed to the TL above.
      - name: Check that something was pushed
        id: pushed
        if: ${{ !cancelled() && steps.escalate.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          OLD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          new_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          if [ "$new_sha" != "$OLD_SHA" ]; then
            echo "Pushed: $BRANCH is now at $new_sha (was $OLD_SHA). The reviewer will run again."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Nothing was pushed to $BRANCH. Handing the PR to the TL."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=needs-tl" > /dev/null
          comment_file="$RUNNER_TEMP/fix-handover-comment.md"
          printf '🤖 The agent could not address the review on this PR (nothing was pushed). The tech lead needs to take over.\n\nSee the [run log](%s) for what happened.\n' \
            "$RUN_URL" > "$comment_file"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$comment_file" > /dev/null

      - name: "Board: Blocked"
        if: ${{ !cancelled() && steps.pushed.outputs.pushed == 'false' && steps.pr.outputs.issue != '' }}
        continue-on-error: true
        uses: ./.github/actions/set-project-status
        with:
          issue-number: ${{ steps.pr.outputs.issue }}
          status: Blocked
          token: ${{ secrets.PROJECT_TOKEN }}
          project-owner: ${{ vars.PROJECT_OWNER }}
          project-number: ${{ vars.PROJECT_NUMBER }}
