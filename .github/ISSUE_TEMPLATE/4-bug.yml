name: Bug
description: Report something that is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic, workaround exists)
        - Medium (feature impaired)
        - High (major feature broken)
        - Critical (crash, data loss, blocker)
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
  - type: input
    id: version
    attributes:
      label: Version / build
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device, browser, hardware, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Paste log output here; it will be formatted as code.
      render: shell
