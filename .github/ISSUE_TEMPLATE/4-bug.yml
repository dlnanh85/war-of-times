name: Bug
description: Report something that is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      value: |
        ### Description:


        ### Steps to reproduce:


        ### Expected result:


        ### Actual result:

    validations:
      required: true
  - type: textarea
    id: files_in_scope
    attributes:
      label: Files in scope
      description: Paths or globs the change may touch. The agent may only change these files.
      placeholder: |
        apps/client/src/ui/**
        README.md
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Things this issue should NOT change (optional).
