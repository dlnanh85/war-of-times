name: Spike
description: A time-boxed research or investigation task to reduce uncertainty.
title: "[Spike]: "
labels: ["spike"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: What do we need to learn or decide?
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this uncertain? What prompted the spike?
  - type: textarea
    id: deliverables
    attributes:
      label: Expected output
      description: What will exist when the spike is done?
      value: |
        - [ ] Written findings / recommendation
        - [ ] Follow-up issues created
    validations:
      required: true
  - type: textarea
    id: files_in_scope
    attributes:
      label: Files in scope
      description: Paths or globs the change may touch. The agent may only change these files.
      placeholder: |
        apps/client/src/ui/**
        README.md
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Things this issue should NOT change (optional).
