name: Spike
description: A time-boxed research or investigation task to reduce uncertainty.
title: "[Spike]: "
labels: ["spike"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: What do we need to learn or decide?
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this uncertain? What prompted the spike?
  - type: textarea
    id: deliverables
    attributes:
      label: Expected output
      description: What will exist when the spike is done?
      value: |
        - [ ] Written findings / recommendation
        - [ ] Follow-up issues created
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue covers, at a high level. Describe the work, not a list of files.
      value: |
        **In scope**
        -

        **Out of scope**
        -
