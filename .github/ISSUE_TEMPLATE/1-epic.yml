name: Epic
description: A large body of work that groups related user stories and features.
title: "[Epic]: "
labels: ["epic"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is this epic about, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal / Business value
      description: Why are we doing this? What outcome or player value does it deliver?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope?
      value: |
        **In scope**
        -

        **Out of scope**
        -
  - type: textarea
    id: children
    attributes:
      label: Child issues
      description: Link the user stories, features, and spikes that belong to this epic.
      placeholder: |
        - [ ] #
        - [ ] #
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How will we know this epic is done?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies & risks
  - type: input
    id: target
    attributes:
      label: Target milestone / release
