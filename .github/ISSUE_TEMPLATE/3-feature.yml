name: Feature
description: Propose a new feature or an enhancement to an existing one.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: requirements
    attributes:
      label: Requirements / acceptance criteria
      value: |
        - [ ]
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Parent epic
      placeholder: "#123"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, references.
