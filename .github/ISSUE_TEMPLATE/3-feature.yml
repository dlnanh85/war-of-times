name: Feature
description: Propose a new feature or an enhancement to an existing one.
title: "[Feature]: "
labels: ["feature"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you want to happen.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements / acceptance criteria
      value: |
        - [ ]
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue covers, at a high level. Describe the work, not a list of files.
      value: |
        **In scope**
        -

        **Out of scope**
        -
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, references.
