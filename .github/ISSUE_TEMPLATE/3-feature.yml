name: Feature
description: Propose a new feature or an enhancement to an existing one.
title: "[Feature]: "
labels: ["feature"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you want to happen.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements / acceptance criteria
      value: |
        - [ ]
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, references.
  - type: textarea
    id: files_in_scope
    attributes:
      label: Files in scope
      description: Paths or globs the change may touch. The agent may only change these files.
      placeholder: |
        apps/client/src/ui/**
        README.md
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Things this issue should NOT change (optional).
