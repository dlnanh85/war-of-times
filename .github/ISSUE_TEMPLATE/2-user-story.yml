name: User Story
description: A small, user-focused piece of functionality that delivers value.
title: "[Story]: "
labels: ["user story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Describe the need from the user's point of view.
      value: |
        As a <type of user>,
        I want <goal>,
        so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions that must be met for this story to be accepted.
      value: |
        - [ ] Given <context>, when <action>, then <outcome>
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Parent epic
      placeholder: "#123"
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate (story points)
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
        - "Not estimated"
  - type: textarea
    id: notes
    attributes:
      label: Notes / design references
      description: Mockups, links, technical notes, open questions.
