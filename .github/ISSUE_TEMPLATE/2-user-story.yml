name: User Story
description: A small, user-focused piece of functionality that delivers value.
title: "[Story]: "
labels: ["user story"]
assignees: ["dlnanh85"]
projects: ["dlnanh85/1"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Describe the need from the user's point of view.
      value: |
        As a <type of user>,
        I want <goal>,
        so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions that must be met for this story to be accepted.
      value: |
        - [ ] Given <context>, when <action>, then <outcome>
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / design references
      description: Mockups, links, technical notes, open questions.
  - type: textarea
    id: files_in_scope
    attributes:
      label: Files in scope
      description: Paths or globs the change may touch. The agent may only change these files.
      placeholder: |
        apps/client/src/ui/**
        README.md
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Things this issue should NOT change (optional).
